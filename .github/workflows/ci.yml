name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Линт без --fix: известные legacy-замечания не блокают merge (continue-on-error).
      # Новые PR по-прежнему должны чистить затронутые файлы через `npx eslint <paths>`.
      - name: Lint
        continue-on-error: true
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests
        run: npm test

      - name: Docker build
        run: docker build -t svels-api:ci .
